[project]
name = "complex_calc"
version = "0.1.0"
description = "Open-source CAS calculator for Linux with a familiar handheld-style command syntax"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.13",
    "scipy>=1.13",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10",
    "PySide6-Essentials>=6.7",
]

[project.scripts]
complex-calc = "complex_calc.cli.repl:main"

[project.gui-scripts]
complex-calc-gui = "complex_calc.gui.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complex_calc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
